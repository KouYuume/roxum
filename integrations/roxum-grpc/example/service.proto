syntax = "proto3";
package unary;
message Greeting { string name = 1; }
message ReplyText { string greeting = 1; }
service Greeter {
  rpc Greet(Greeting) returns (ReplyText);
  rpc Watch(Greeting) returns (stream ReplyText);
  rpc CountGreetings(stream Greeting) returns (ReplyText);
  rpc Converse(stream Greeting) returns (stream ReplyText);
}
