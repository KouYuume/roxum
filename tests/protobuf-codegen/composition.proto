syntax = "proto3";
package composition;

import "scalar.proto";

// Shared schema for generated Roc codecs and the independent Python oracle.
message OptionalEnvelope {
  optional probe.OptionalScalars child = 1;
  uint32 tail = 2;
}

message ScalarEnvelope {
  probe.Scalars child = 1;
  uint32 tail = 2;
}

message Top { OptionalEnvelope envelope = 1; }

message Collections { repeated string texts = 1; repeated bytes chunks = 2; }
message CollectionEnvelope { Collections child = 1; }

message MessageList { repeated Collections children = 1; }
message MessageListEnvelope { MessageList child = 1; }
