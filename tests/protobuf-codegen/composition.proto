syntax = "proto3";
package composition;

import "scalar.proto";

// Shared schema for generated Roc codecs and the independent Python oracle.
message OptionalEnvelope {
  optional probe.OptionalScalars child = 1;
  uint32 tail = 2;
}

message ScalarEnvelope {
  probe.Scalars child = 1;
  uint32 tail = 2;
}

message Top { OptionalEnvelope envelope = 1; }

message Collections { repeated string texts = 1; repeated bytes chunks = 2; }
message CollectionEnvelope { Collections child = 1; }

message MessageList { repeated Collections children = 1; }
message MessageListEnvelope { MessageList child = 1; }

message UnsignedLists {
  repeated uint32 unsigned32 = 1;
  repeated uint64 unsigned64 = 2;
  repeated fixed32 fixed32_value = 3 [packed = true];
  repeated fixed64 fixed64_value = 4;
  repeated uint32 expanded32 = 5 [packed = false];
  repeated uint64 expanded64 = 6 [packed = false];
  repeated fixed32 expanded_fixed32 = 7 [packed = false];
  repeated fixed64 expanded_fixed64 = 8 [packed = false];
}
message UnsignedListEnvelope { UnsignedLists child = 1; uint32 tail = 2; }
