syntax = "proto3";
package composition;

import "scalar.proto";

// Shared schema for generated Roc codecs and the independent Python oracle.
message OptionalEnvelope {
  optional probe.OptionalScalars child = 1;
  uint32 tail = 2;
}

message ScalarEnvelope {
  probe.Scalars child = 1;
  uint32 tail = 2;
}

message Top { OptionalEnvelope envelope = 1; }

message Collections { repeated string texts = 1; repeated bytes chunks = 2; }
message CollectionEnvelope { Collections child = 1; }

message MessageList { repeated Collections children = 1; }
message MessageListEnvelope { MessageList child = 1; }

message UnsignedLists {
  repeated uint32 unsigned32 = 1;
  repeated uint64 unsigned64 = 2;
  repeated fixed32 fixed32_value = 3 [packed = true];
  repeated fixed64 fixed64_value = 4;
  repeated uint32 expanded32 = 5 [packed = false];
  repeated uint64 expanded64 = 6 [packed = false];
  repeated fixed32 expanded_fixed32 = 7 [packed = false];
  repeated fixed64 expanded_fixed64 = 8 [packed = false];
}
message UnsignedListEnvelope { UnsignedLists child = 1; uint32 tail = 2; }

message ScalarLists {
  repeated int32 signed32 = 1;
  repeated int64 signed64 = 2;
  repeated sint32 zigzag32 = 3;
  repeated sint64 zigzag64 = 4;
  repeated sfixed32 signed_fixed32 = 5;
  repeated sfixed64 signed_fixed64 = 6;
  repeated bool enabled = 7;
  repeated float float_value = 8;
  repeated double double_value = 9;
  repeated int32 expanded_signed32 = 10 [packed = false];
  repeated int64 expanded_signed64 = 11 [packed = false];
  repeated sint32 expanded_zigzag32 = 12 [packed = false];
  repeated sint64 expanded_zigzag64 = 13 [packed = false];
  repeated sfixed32 expanded_signed_fixed32 = 14 [packed = false];
  repeated sfixed64 expanded_signed_fixed64 = 15 [packed = false];
  repeated bool expanded_enabled = 16 [packed = false];
  repeated float expanded_float_value = 17 [packed = false];
  repeated double expanded_double_value = 18 [packed = false];
}
message ScalarListEnvelope { ScalarLists child = 1; uint32 tail = 2; }
