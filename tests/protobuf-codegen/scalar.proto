syntax = "proto3";
package probe;

import "catalog.proto";

message Packet {
  uint64 count = 1;
  fixed32 code = 15;
  fixed64 stamp = 16;
  bytes payload = 536870911;
}

message Empty {}

// Service declarations do not generate bindings in codec mode.
service Echo {
  rpc Send(Packet) returns (Packet);
  rpc Inspect(catalog.Entry.Detail) returns (Envelope.Payload);
}

message Scalars {
  uint32 unsigned32 = 1;
  int32 signed32 = 2;
  int64 signed64 = 3;
  sint32 zigzag32 = 4;
  sint64 zigzag64 = 5;
  sfixed32 signed_fixed32 = 6;
  sfixed64 signed_fixed64 = 7;
  bool enabled = 8;
  string text = 9;
  float float_value = 10;
  double double_value = 11;
}

// All scalar payload layouts share explicit presence, independent of default values.
message OptionalScalars {
  optional uint32 unsigned32 = 1;
  optional int32 signed32 = 2;
  optional int64 signed64 = 3;
  optional sint32 zigzag32 = 4;
  optional sint64 zigzag64 = 5;
  optional sfixed32 signed_fixed32 = 6;
  optional sfixed64 signed_fixed64 = 7;
  optional bool enabled = 8;
  optional string text = 9;
  optional float float_value = 10;
  optional double double_value = 11;
  optional uint64 unsigned64 = 12;
  optional fixed32 fixed32_value = 13;
  optional fixed64 fixed64_value = 14;
  optional bytes payload = 15;
  uint32 implicit_value = 16;
}

// Lexical nesting defines separate scalar codecs, not message-valued fields.
message Envelope {
  message Payload {
    optional string text = 1;
  }
  message Empty {}
}

message EnumPacket {
  enum Mode { MODE_ZERO = 0; MODE_ON = 1; }
  catalog.State state = 1;
  optional catalog.State selected = 2;
  repeated catalog.State states = 3;
  repeated catalog.State expanded = 4 [packed = false];
  Mode mode = 5;
}
message EnumEnvelope { EnumPacket child = 1; }

message MapPacket {
  map<int32, string> signed32 = 1;
  map<int64, catalog.State> signed64 = 2;
  map<uint32, bytes> unsigned32 = 3;
  map<uint64, string> unsigned64 = 4;
  map<bool, Packet> flags = 5;
  map<string, Packet> strings = 6;
  map<sint32, int32> zigzag32 = 7;
  map<sint64, int64> zigzag64 = 8;
  map<fixed32, float> fixed32 = 9;
  map<fixed64, double> fixed64 = 10;
  map<sfixed32, bool> sfixed32 = 11;
  map<sfixed64, uint64> sfixed64 = 12;
}
message MapEnvelope { MapPacket child = 1; }

message ChoiceChild {
  string text = 1;
  repeated uint32 numbers = 2;
  map<string, uint32> labels = 3;
}
message ChoicePacket {
  oneof choice {
    uint64 unsigned64 = 1;
    uint32 unsigned32 = 2;
    int32 signed32 = 3;
    int64 signed64 = 4;
    sint32 zigzag32 = 5;
    sint64 zigzag64 = 6;
    fixed32 fixed32_value = 7;
    fixed64 fixed64_value = 8;
    sfixed32 signed_fixed32 = 9;
    sfixed64 signed_fixed64 = 10;
    bool enabled = 11;
    string text = 12;
    bytes payload = 13;
    float float_value = 14;
    double double_value = 15;
    catalog.State state = 16;
    ChoiceChild child_value = 17;
    ChoiceChild other_child = 18;
  }
  oneof secondary { bytes extra = 19; }
  optional uint32 marker = 20;
  uint32 outside = 21;
}
message ChoiceEnvelope { ChoicePacket child = 1; }

message RecursiveNode {
  uint32 value = 1;
  RecursiveNode next = 2;
  repeated RecursiveNode children = 3;
  oneof choice { RecursiveNode selected = 4; string text = 5; }
  map<string, RecursiveNode> lookup = 6;
}
message MutualLeft { uint32 value = 1; MutualRight right = 2; }
message MutualRight { uint32 value = 1; MutualLeft left = 2; }
message RecursiveEnvelope { RecursiveNode node = 1; MutualLeft mutual = 2; }
