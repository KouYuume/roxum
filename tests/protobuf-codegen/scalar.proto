syntax = "proto3";
package probe;

message Packet {
  uint64 count = 1;
  fixed32 code = 15;
  fixed64 stamp = 16;
  bytes payload = 536870911;
}

message Empty {}

// Service declarations do not generate bindings in codec mode.
service Echo {
  rpc Send(Packet) returns (Packet);
}

message Scalars {
  uint32 unsigned32 = 1;
  int32 signed32 = 2;
  int64 signed64 = 3;
  sint32 zigzag32 = 4;
  sint64 zigzag64 = 5;
  sfixed32 signed_fixed32 = 6;
  sfixed64 signed_fixed64 = 7;
  bool enabled = 8;
  string text = 9;
  float float_value = 10;
  double double_value = 11;
}

// All scalar payload layouts share explicit presence, independent of default values.
message OptionalScalars {
  optional uint32 unsigned32 = 1;
  optional int32 signed32 = 2;
  optional int64 signed64 = 3;
  optional sint32 zigzag32 = 4;
  optional sint64 zigzag64 = 5;
  optional sfixed32 signed_fixed32 = 6;
  optional sfixed64 signed_fixed64 = 7;
  optional bool enabled = 8;
  optional string text = 9;
  optional float float_value = 10;
  optional double double_value = 11;
  optional uint64 unsigned64 = 12;
  optional fixed32 fixed32_value = 13;
  optional fixed64 fixed64_value = 14;
  optional bytes payload = 15;
  uint32 implicit_value = 16;
}
