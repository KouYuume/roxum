name: CI

# The fast subset for pull requests. The full checks run locally before a push
# (docs/contributing.md) and in CI before a release (full-checks.yml).
# The job always reports, so the rulesets can require it; it skips its steps
# when only Markdown other than the changelog changed, which no check reads.
on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Find whether anything besides Markdown changed
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch, or a base this clone lacks, gets every check.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if grep -qvE '\.md$' <<< "$changed" || grep -qx 'CHANGELOG.md' <<< "$changed"; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown other than the changelog changed; skipping the checks"
            echo "checked=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: steps.changes.outputs.checked == 'true'
        with:
          version: 0.16.0
      - name: Install the pinned Roc nightly
        if: steps.changes.outputs.checked == 'true'
        run: |
          tools/install-roc-nightly.sh "$RUNNER_TEMP/roc"
          echo "$RUNNER_TEMP/roc" >> "$GITHUB_PATH"
      - name: Check the changelog and the release metadata
        if: steps.changes.outputs.checked == 'true'
        run: zig build test-m9p3
      - name: Check the local-check and agent hooks
        if: steps.changes.outputs.checked == 'true'
        run: |
          python3 tests/local-check/test_verify_local_check.py
          python3 tests/local-check/test_agent_policy.py
      - name: Run unit, differential, and incremental tests
        if: steps.changes.outputs.checked == 'true'
        run: zig build test
      - name: Run the E2E tests in the dev backend
        if: steps.changes.outputs.checked == 'true'
        run: zig build test-e2e -Dopt=dev
